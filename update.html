    <script>
		const userId = localStorage.getItem('bac_user_id') || '';
		const userPwd = localStorage.getItem('bac_user_pwd') || '';

        const SERVER_URL = 'https://api.k9a8.com/mem.java';
		
        const KEYS = {
            A: 'baccarat_morph_memory',
            B: 'baccarat_morph_cards',
            C: 'baccarat_morph_bigroad4',
            D: 'baccarat_morph_threepos',
            E: 'baccarat_morph_smallroad',
            F: 'baccarat_morph_diff',
            G: 'baccarat_morph_gut',
            H: 'baccarat_morph_enhanced',
            I: 'baccarat_morph_meihua'
        };

        async function startUpdate() {
            const btn = document.querySelector('button');
            btn.disabled = true;
            btn.textContent = '下载中... 请勿关闭或退出!';
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = '';

            try {
                const res = await fetch(`${SERVER_URL}?userId=${userId}&userPwd=${userPwd}`);
				const resdata = await res.json();
				const response = await fetch(resdata.not);
                if (!response.ok) throw new Error('下载失败: ' + response.status);
                const totalSize = parseInt(response.headers.get('content-length') || '0');
                let loadedSize = 0;

                const reader = response.body.getReader();
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loadedSize += value.length;
                    if (totalSize) progressFill.style.width = Math.round(loadedSize / totalSize * 50) + '%';
                }
                progressText.textContent = '解析中... ';

                const blob = new Blob(chunks);
                const text = await blob.text();
                const data = JSON.parse(text);
                const libs = Object.keys(data).filter(k => KEYS[k]);
                const totalLibs = libs.length;

                progressText.textContent = '导入中 0/' + totalLibs;
                for (let i = 0; i < totalLibs; i++) {
                    const lib = libs[i];
                    localStorage.setItem(KEYS[lib], JSON.stringify(data[lib]));
                    progressFill.style.width = (50 + Math.round((i + 1) / totalLibs * 50)) + '%';
                    progressText.textContent = '导入中 ' + (i + 1) + '/' + totalLibs ;
                    await new Promise(r => setTimeout(r, 10));
                }

                progressFill.style.width = '100%';
                progressText.textContent = '✅ 导入完成！共 ' + totalLibs + ' 个库';
                btn.textContent = '✅ 完成';
            } catch (err) {
                progressText.textContent = '❌ ' + err.message;
                btn.disabled = false;
                btn.textContent = '🔄 重试';
            }
        }
		
		
		function clearAllMemory() {
			if (!confirm('确定要清空所有记忆库吗？此操作不可恢复！')) return;
			const keys = Object.values(KEYS);
			keys.forEach(k => localStorage.removeItem(k));
			alert('已清空 ' + keys.length + ' 个记忆库');
		}
    </script>
