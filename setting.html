		<div id="loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; display:none; justify-content:center; align-items:center;">

    <h2>⚙️ 预测开关设置</h2>

    <p class="info">下面为各大预测项的票数：0=不投票仅预测 | 1-9=投票票数。</p>

    <div id="settings-container"></div>
	
	<div class="section">
        <div class="section-title">🎯 追踪信号管理</div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <select id="track-select" style="background:#222; color:#ddd; border:1px solid #333; border-radius:4px; padding:6px;">
                <option value="">选择信号...</option>
            </select>
            <button onclick="addTrackSignal()" style="padding:6px 14px;">➕ 添加</button>
            <button onclick="resetTrackSignals()" style="background:#e74c3c; padding:6px 14px;">🔄 重置</button>
        </div>
        <div id="track-list" style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">请先保存好其它全部配置后添加信号，否则会被清空</div>
    </div>

<div class="section">
    <div class="section-title">🧠 特殊模式</div>
    <div class="row">
        <label>反向下注（0=正常 1=反向）</label>
        <input type="number" id="set_DECIDER_REVERSE" value="0" min="0" max="1">
    </div>
    <div class="row">
        <label>学习模式（0=只读不写 1=正常学习）</label>
        <input type="number" id="set_LEARN_MODE" value="1" min="0" max="1">
    </div>
	<div class="row">
        <label>智能决策（0=按票多 1=智能反向下注）</label>
        <input type="number" id="set_SMART_DECIDER" value="0" min="0" max="1">
    </div>
</div>

    <button class="green" onclick="saveSettings()" title="保存全部全局设置 ">💾 保存设置</button>
    <button onclick="resetDefaults()" title="将会全部归 0 " style="background:#888;">🔄 恢复默认</button>
    <button onclick="window.location.href='update.html'" title="点击进入安装页面">📥 装记忆库</button>
    <p class="info" id="status">修改后点保存生效。</p>
	
<div class="section">
    <div class="section-title">🔒 修改密码</div>
    <div class="row pwd">
        <label>旧密码</label>
        <input type="password" id="oldPassword" placeholder="输入旧密码">
    </div>
    <div class="row pwd">
        <label>新密码</label>
        <input type="password" id="newPassword" placeholder="至少6位">
    </div>
    <div class="row pwd">
        <label>确认新密码</label>
        <input type="password" id="confirmPassword" placeholder="再次输入新密码">
    </div>
    <div class="row">
        <label></label>
        <button onclick="changePassword()">修改密码</button>
        <span id="pwdStatus" style="margin-left:10px;font-size:0.85rem;"></span>
    </div>
</div>

<div class="section" id="cardSection" style="display:none;">
    <div class="section-title">🎫 输入升级码，升级高级用户</div>
    <div class="row kami">
        <label>升级码</label>
        <input type="text" id="cardKey" placeholder="输入8位升级码" maxlength="8" style="text-transform:uppercase">
    </div>
    <div class="row">
        <label></label>
        <button id="cardbutton" onclick="redeemCard()">升级用户</button>
        <span id="cardStatus" style="margin-left:10px;"></span>
    </div>
</div>
