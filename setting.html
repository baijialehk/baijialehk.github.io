    <h2>⚙️ 预测开关设置</h2>

    <p class="info">下面为各大预测项的票数：0=不投票仅预测 | 1-9=投票票数。</p>

	<div class="section">
        <div class="section-title">🎯 追踪信号管理</div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <select id="track-select" style="background:#222; color:#ddd; border:1px solid #333; border-radius:4px; padding:6px;">
                <option value="">选择信号...</option>
            </select>
            <button onclick="addTrackSignal()" style="padding:6px 14px;">➕ 添加</button>
            <button onclick="resetTrackSignals()" style="background:#e74c3c; padding:6px 14px;">🔄 重置</button>
        </div>
        <div id="track-list" style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">请先保存好其它全部配置后添加信号，否则会被清空</div>
    </div>

<div class="section">
    <div class="section-title">🧠 特殊模式</div>
    <div class="row">
        <label>反向下注（0=正常 1=反向）</label>
        <input type="number" id="set_DECIDER_REVERSE" value="0" min="0" max="1">
    </div>
    <div class="row">
        <label>学习模式（0=只读不写 1=正常学习）</label>
        <input type="number" id="set_LEARN_MODE" value="1" min="0" max="1">
    </div>
	<div class="row">
        <label>智能决策（0=按票多 1=智能反向下注）</label>
        <input type="number" id="set_SMART_DECIDER" value="0" min="0" max="1">
    </div>
</div>

    <button onclick="window.location.href='update.html'" title="点击进入安装页面">📥 装记忆库</button>

<div class="section">

    <div class="row pwd">

    </div>
    <div class="row pwd">
        <label>新密码</label>

    </div>
    <div class="row pwd">
        <label>确认新密码</label>
        <input type="password" id="confirmPassword" placeholder="再次输入新密码">
    </div>
    <div class="row">
        <label></label>
        <button onclick="changePassword()">修改密码</button>
        <span id="pwdStatus" style="margin-left:10px;font-size:0.85rem;"></span>
    </div>

    <script>
    const API_BASE = 'https://api.k9a8.com';
    const userId = localStorage.getItem('bac_user_id') || '';
	const userPwd = localStorage.getItem('bac_user_pwd') || '';
		// 在内存中保留一份完整配置，作为“本地缓存”
    let cachedConfig = {};
	
    const SIGNAL_GROUPS = [
        {
            title: '第一梯队：大数据',
            keys: [

                { key: 'C_bigroad4', name: '四列大路记忆' },
                { key: 'D_threePos', name: '三局总点数记忆' },
                { key: 'E_smallRoad', name: '小路形态记忆' },
                { key: 'F_diff', name: '三珠三三记忆' },
                { key: 'H_morphQ', name: '二次三维记忆' },
                { key: 'I_meihua', name: '前局玄点记忆' },
            ]
        },
        {
            title: '第二梯队：实时信号',
            keys: [
                { key: 'V_dragon', name: '单边龙' },
                { key: 'V_singleJump', name: '痴痴连' },
                { key: 'V_bigEyeBlue', name: '大眼仔连续蓝点' },
                { key: 'V_meihua', name: '梅花易数' },
                { key: 'V_resonanceMeihua', name: '共振+梅花双重趋势' },
                { key: 'V_threePosSignal', name: '三珠路信号' },
                { key: 'V_sanluGongZen', name: '三路共振' },
                { key: 'V_smallRoadxh', name: '小路信号' },
                { key: 'V_smallFault', name: '小路断层' },
                { key: 'V_smallRoadDir', name: '小路同向' },
                { key: 'V_bigRoadExt', name: '大路新形态' },
                { key: 'V_QinTinDianSui', name: '蜻蜓点水' },
                { key: 'V_GeSanDaNiu', name: '隔山打牛' },
                { key: 'V_DanTiaoLong', name: '单跳龙' },
                { key: 'V_fengBtiao', name: '逢闲连逢庄跳' },
                { key: 'V_fengPtiao', name: '逢庄连逢闲跳' },
                { key: 'V_dinTouCui', name: '顶头锤' },
                { key: 'V_CenGanTiao', name: '撑杆跳' },
                { key: 'V_SuoGuLong', name: '缩骨龙' },
                { key: 'V_SanPoRoad', name: '上坡路' },
                { key: 'V_PaiPaiLian', name: '拍拍连预警' },
                { key: 'V_LianFanYiTing', name: '两房一厅' },
                { key: 'V_DuiCenJiaXin', name: '对称夹心' },
                { key: 'V_SanFanYiTin', name: '三房一厅' },
                { key: 'V_PaiPaiZuo', name: '排排坐' },
                { key: 'V_danTiao', name: '痴痴连单跳' },
                { key: 'V_CanLong', name: '长龙' },
                { key: 'V_DuanLieXu', name: '短列延续' },
                { key: 'V_luGuaYiZi', name: '路卦一致' },
                { key: 'V_dragonMeihua', name: '龙卦合鸣' },
                { key: 'V_upDownNo', name: '上下背离' },
                { key: 'V_rhythmLink', name: '连断节奏' },
                { key: 'V_cardDragon', name: '牌型助长龙' },
                { key: 'V_bigCardBreak', name: '大牌断龙' },
                { key: 'V_eDragon', name: '小路形态顺龙' },
                { key: 'V_eBreakTop', name: '小路形态破顶' },
                { key: 'V_eBreakChaos', name: '小路形态破乱' },
            ]
        },
        {
            title: '第三梯队：赌徒直觉',
            keys: [
                { key: 'V3_pointTrend', name: '连小转势' },
                { key: 'V3_bigWinRevert', name: '连胜后回归' },
                { key: 'V3_diffFollow', name: '靴内差值跟大势' },
                { key: 'V3_diffDirection', name: '靴尾差值明确' },
                { key: 'V3_PinPiaoDuan', name: '平票看连断' },
                { key: 'V3_singleJumpSmall', name: '单跳与小路同向' },
                { key: 'V3_dragonReverse', name: '龙断票近反转' },
                { key: 'V3_dragonJu', name: '票聚龙延加码' },
                { key: 'V3_WuJiBiFan', name: '物极必反' },
                { key: 'V3_RandomReverse', name: '票少随机反向' },
                { key: 'V3_cardStrong', name: '记忆库强信号' },
                { key: 'V3_morphDouble', name: '记忆连触回调' },
                { key: 'V3_LeiZenFan', name: '信号波动追踪' },
                { key: 'V3_clipReverse', name: '对称夹心反向' },
                { key: 'V3_lateShoe', name: '后半靴延续' },
                { key: 'V3_three33', name: '三三信号共振' },
                { key: 'V3_consecutiveHits', name: '连中后保守' },
                { key: 'V3_jumpGuard', name: '跳后防连' },
                { key: 'V3_newFormGuard', name: '新形态翻车防连' },
                { key: 'V3_smallBlueGuard', name: '小路长蓝防连' },
                { key: 'V3_smallTripleRed', name: '小路三连红+同向' },
                { key: 'V3_diffSmall', name: '差值+小路同向' },
            ]
        },
    ];
	
// 1. 加载：从服务端一次性拉取配置到 cachedConfig
    async function loadSettingsFromServer() {
        if (!userId) {
            document.getElementById('status').textContent = '❌ 请先在首页登录';
            return;
        }		
			document.getElementById('loading-overlay').style.display = 'flex';   //显示等待画面
        try {
            const res = await fetch(`${API_BASE}/api/settings?userId=${userId}&userPwd=${userPwd}`);
            if (!res.ok) throw new Error('加载失败，请检查网络');
            const data = await res.json();
            cachedConfig = data.config || {};
            document.getElementById('status').textContent = `* 修改后点保存生效。${userId}已登录 `;
        } catch(e) {
            console.error('加载配置失败:', e);
            document.getElementById('status').textContent = '❌ 加载配置失败';
            cachedConfig = {}; // 失败则使用空对象
			return;
        }
		document.getElementById('loading-overlay').style.display = 'none';   //关闭等待画面
    }

    // 2. 渲染：根据 cachedConfig 渲染所有UI
    function renderAllUI() {
        renderSettings();
        renderTrackSignals();
    }

    // 渲染权重设置
    function renderSettings() {
        const voteWeights = cachedConfig.VOTE_WEIGHTS || {};
        const container = document.getElementById('settings-container');
        let html = '';
        SIGNAL_GROUPS.forEach(group => {
            html += `<div class="section"><div class="section-title">${group.title}</div>`;
            group.keys.forEach(({ key, name }) => {
                const val = voteWeights[key] !== undefined ? voteWeights[key] : 1;
                html += `<div class="row">
                    <label>${name}</label>
                    <input type="number" id="set_${key}" value="${val}" min="0" max="9"> 
                </div>`;
            });
            html += `</div>`;
        });
        container.innerHTML = html;

        // 特殊配置项
        const deciderRev = document.getElementById('set_DECIDER_REVERSE');
        if (deciderRev) deciderRev.value = cachedConfig.DECIDER_REVERSE ?? 0;
        const learnMode = document.getElementById('set_LEARN_MODE');
        if (learnMode) learnMode.value = cachedConfig.LEARN_MODE ?? 1;
        const smart = document.getElementById('set_SMART_DECIDER');
        if (smart) smart.value = cachedConfig.SMART_DECIDER ?? 0;
    }

    // 渲染追踪信号
    function renderTrackSignals() {
        const tracked = cachedConfig.TRACKED_SIGNALS || [];
        const list = document.getElementById('track-list');
        list.innerHTML = tracked.length === 0 
            ? '<span style="color:#999;">暂未添加追踪信号</span>' 
            : tracked.map(name => 
                `<span style="background:#333; padding:4px 10px; border-radius:4px; display:flex; align-items:center; gap:6px;">
                    ${name} <span onclick="removeTrackSignal('${name}')" style="cursor:pointer; color:#e74c3c;">✕</span>
                </span>`
            ).join('');

        const select = document.getElementById('track-select');
        const allNames = [];
        SIGNAL_GROUPS.forEach(g => g.keys.forEach(k => allNames.push(k.name)));
        select.innerHTML = '<option value="">选择信号...</option>' + 
            allNames.filter(n => !tracked.includes(n)).map(n => `<option value="${n}">${n}</option>`).join('');
    }

    // 3. 修改：只更新 cachedConfig 中的值，不保存
    function addTrackSignal() {
        const select = document.getElementById('track-select');
        const name = select.value;
        if (!name) return;
        const tracked = cachedConfig.TRACKED_SIGNALS || [];
        if (!tracked.includes(name)) {
            tracked.push(name);
            cachedConfig.TRACKED_SIGNALS = tracked;
            renderTrackSignals(); // 只重新渲染
        }
    }

    function removeTrackSignal(name) {
        const tracked = cachedConfig.TRACKED_SIGNALS || [];
        cachedConfig.TRACKED_SIGNALS = tracked.filter(n => n !== name);
        renderTrackSignals(); // 只重新渲染
    }

    function resetTrackSignals() {
        cachedConfig.TRACKED_SIGNALS = [];
        renderTrackSignals(); // 只重新渲染
    }

    // 4. 保存：从UI收集所有值，更新 cachedConfig，并一次性发送给服务端
    async function saveSettings() {
		document.getElementById('loading-overlay').style.display = 'flex';   //显示等待画面
        // 从 UI 收集权重
        const voteWeights = cachedConfig.VOTE_WEIGHTS || {};
        SIGNAL_GROUPS.forEach(group => {
            group.keys.forEach(({ key }) => {
                const input = document.getElementById('set_' + key);
                if (input) voteWeights[key] = Math.max(0, Math.min(9, parseInt(input.value) || 0));
            });
        });
        cachedConfig.VOTE_WEIGHTS = voteWeights;

        // 从 UI 收集特殊配置
        cachedConfig.LEARN_MODE = parseInt(document.getElementById('set_LEARN_MODE')?.value) ?? 1;
        cachedConfig.DECIDER_REVERSE = parseInt(document.getElementById('set_DECIDER_REVERSE')?.value) ?? 0;
        cachedConfig.SMART_DECIDER = parseInt(document.getElementById('set_SMART_DECIDER')?.value) ?? 0;

        // 一次性保存到服务端
        try {
            const res = await fetch(`${API_BASE}/api/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, userPwd, config: cachedConfig })
            });
            if (!res.ok) throw new Error('未知错误、免费用户没有设置功能');						
			localStorage.setItem('baccarat_settings', JSON.stringify(cachedConfig));  // 同时存本地
            document.getElementById('status').textContent = '✅ 设置已保存';
        } catch(e) {
            document.getElementById('status').textContent = '❌ 保存失败: ' + e.message;
        }
				document.getElementById('loading-overlay').style.display = 'none';   //关闭等待画面
    }
	
	async function changePassword() {
		const oldPwd = document.getElementById('oldPassword').value;
		const newPwd = document.getElementById('newPassword').value;
		const confirmPwd = document.getElementById('confirmPassword').value;
		const status = document.getElementById('pwdStatus');

        if (!userId) {
            status.textContent = '❌ 请先在首页登录';
            return;
        }
		if (!oldPwd || !newPwd || !confirmPwd) {
			status.textContent = '❌ 请填写所有密码字段';
			status.style.color = '#e74c3c';
			return;
		}
		if (newPwd !== confirmPwd) {
			status.textContent = '❌ 两次新密码不一致';
			status.style.color = '#e74c3c';
			return;
		}
		if (newPwd.length < 6 || newPwd.length > 15) {
			status.textContent = '❌ 新密码需要6-15位';
			status.style.color = '#e74c3c';
			return;
		}
			document.getElementById('loading-overlay').style.display = 'flex';   //显示等待画面

		try {
			const res = await fetch(`${API_BASE}/api/changepwd`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					userId,
					userPwd,
					oldPassword: oldPwd,
					newPassword: newPwd
				})
			});
			const data = await res.json();
			if (res.ok) {
				status.textContent = '✅ ' + data.msg;
				status.style.color = '#27ae60';
				// 更新本地存储的密码哈希
				localStorage.setItem('bac_user_pwd', data.newPwdHash);
				document.getElementById('oldPassword').value = '';
				document.getElementById('newPassword').value = '';
				document.getElementById('confirmPassword').value = '';
			} else {
				status.textContent = '❌ ' + (data.error || '修改失败');
				status.style.color = '#e74c3c';
			}			
			document.getElementById('loading-overlay').style.display = 'none';   //关闭等待画面
		} catch (e) {
			status.textContent = '❌ 网络错误';
			status.style.color = '#e74c3c';
			document.getElementById('loading-overlay').style.display = 'none';   //关闭等待画面
		}
		
	}
	
    async function resetDefaults() {
        // 重置为默认值，直接修改 cachedConfig
        cachedConfig.VOTE_WEIGHTS = {};
        cachedConfig.DECIDER_REVERSE = 0;
        cachedConfig.LEARN_MODE = 1;
        cachedConfig.SMART_DECIDER = 0;
        renderAllUI(); // 用默认值重绘UI
        document.getElementById('status').textContent = '✅ 已恢复默认值（尚未保存）';
    }

    // 页面初始化
    (async function init() {
        await loadSettingsFromServer();
        renderAllUI();
    })();
</script>
